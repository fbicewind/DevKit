[package]
name = "devkit"
version = "1.0.0"
description = "Offline macOS developer toolkit"
authors = ["DevKit"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "devkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "devkit"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-dialog", "dep:tauri-plugin-clipboard-manager", "dep:security-framework"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
chrono = { version = "=0.4.42", features = ["serde"] }
chrono-tz = "=0.10.4"
rand = "=0.8.5"
md-5 = "=0.10.6"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.22.1"
uuid = { version = "=1.18.1", features = ["v4"] }
tempfile = "=3.23.0"
tauri = { version = "=2.12.5", features = ["macos-private-api"], optional = true }
tauri-plugin-global-shortcut = { version = "=2.3.1", optional = true }
tauri-plugin-dialog = { version = "=2.6.0", optional = true }
tauri-plugin-clipboard-manager = { version = "=2.3.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.5.1", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# LLVM stripping can produce dylibs rejected by macOS 27's loader.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"

[profile.release.build-override]
strip = "none"
